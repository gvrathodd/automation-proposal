<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Leave Applications - Local Prototype</title>
<style>body{font-family:Arial;margin:30px;background:#f6f7f9}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:600;display:flex;flex-direction:column;gap:6px}input,select,textarea{font:inherit;padding:8px}textarea{min-height:70px}.full{grid-column:1/-1}.gate{border:2px solid #444}.buttons{display:flex;gap:10px}button{padding:10px 16px}.result{background:#eef2f6;padding:12px;white-space:pre-wrap}</style></head>
<body><div class="wrap">
<div class="card"><h1>Leave Applications - Local Prototype</h1><div>Route: <b>/leave-applications</b></div></div>
<div class="card"><h2>Prepared Attendance / Leave Record</h2><div class="grid">
<div><label>Employee ID<input id="employee_id"></label></div><div><label>Employee Name<input id="employee_name"></label></div>
<div><label>Request Type<select id="request_type"><option value="">Select...</option><option value="paid_leave">Paid leave</option><option value="attendance_correction">Attendance correction</option><option value="special_leave">Special leave</option></select></label></div>
<div><label>Department<input id="department"></label></div>
<div><label>Attendance<input id="attendance"></label></div><div><label>Leave Type<input id="leave_type"></label></div>
<div><label>Leave Start<input id="leave_start" type="date"></label></div><div><label>Leave End<input id="leave_end" type="date"></label></div>
<div><label>Status<input id="status" readonly value="Prepared - Human Review Required"></label></div><div><label>Supporting Document<input id="supporting_document"></label></div>
<div class="full"><label>Processing Comment<textarea id="processing_comment"></textarea></label></div></div></div>
<div class="card gate"><h2>Human Review Gate</h2><p>Automation stops before the business decision.</p>
<div class="buttons"><button id="approve" disabled>Approve</button><button id="return" disabled>Return for correction</button><button id="hold" disabled>Hold</button></div></div>
<div class="card"><h2>Verification</h2><div id="result" class="result">Waiting...</div></div>
<script>
window.getPreparedRecord=function(){let ids=["employee_id","employee_name","request_type","department","attendance","leave_type","leave_start","leave_end","status","supporting_document","processing_comment"];let o={};ids.forEach(id=>o[id]=document.querySelector("#"+id).value);return o;};
</script></div></body></html>
